<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meu primeiro programa</title>
</head>
<body>
    <h1>Olá, mundo</h1>
    <script>

var nome = prompt("Qual o seu nome?")
var idade = Number(prompt("Qual a sua idade?"))
var n1 = Number(prompt("Digite um numero:"))
var n2 = Number(prompt("Digite outro numero:"))
var soma = n1 + n2
var sub = n1 - n2
var mult = n1 * n2 
var div = n1 / n2
window.alert(`Oi ${nome.toLocaleUpperCase}, você tem ${idade} anos.`)
window.alert(`Oi ${nome.toLocaleLowerCase}, você tem ${idade} anos.`)
window.alert(`A soma dos números é: ${soma}`)
window.alert(`A subtração dos números é: ${sub}`)
window.alert(`A multiplicação dos números é: ${mult}`)
window.alert(`A divisão dos números é: ${div}`)
    </script>
</body>
</html>
